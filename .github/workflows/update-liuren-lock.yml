name: Refresh Liuren dependency lock

on:
  push:
    branches: [agent/liuren-complete-phase5]
    paths:
      - packages/core/package.json

permissions:
  contents: write

jobs:
  refresh-lock:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore: refresh Liuren lockfile') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/liuren-complete-phase5
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Refresh package lock only
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh Liuren lockfile"
          git push origin HEAD:agent/liuren-complete-phase5
