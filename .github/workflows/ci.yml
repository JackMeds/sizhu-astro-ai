name: Validate core and web

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Refresh lockfile on Phase 5 PR
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/liuren-complete-phase5'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: refresh Liuren lockfile"
            git push origin HEAD:agent/liuren-complete-phase5
          fi
      - name: Core and prompt tests
        run: npm run test
      - name: Typecheck workspaces
        run: npm run typecheck
      - name: Build web
        run: npm run build:web

  liuren-reference:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Checkout pinned kinliuren source
        uses: actions/checkout@v4
        with:
          repository: kentang2017/kinliuren
          ref: 3ba45a9540f08269b56d81508a061c7d46938785
          path: _oracle/kinliuren
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate pinned executable fixture
        env:
          PYTHONPATH: _oracle/kinliuren/src
        run: python tools/liuren-reference/oracle.py --validate-pinned-fixture > /tmp/liuren-reference.json
      - name: Show reference summary
        run: |
          python - <<'PY'
          import json
          data = json.load(open('/tmp/liuren-reference.json', encoding='utf-8'))
          print('節氣:', data.get('節氣'))
          print('日期:', data.get('日期'))
          print('格局:', data.get('格局'))
          print('三傳:', data.get('三傳'))
          print('核心 result 含神煞:', '神煞' in data)
          PY
