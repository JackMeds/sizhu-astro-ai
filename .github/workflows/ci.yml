name: Validate core, web and WebMCP

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Core, prompt and locale tests
        run: npm run test
      - name: Typecheck workspaces
        run: npm run typecheck
      - name: Build MCP quick start
        run: npm run build:mcp
      - name: Build web
        run: npm run build:web

  webmcp-smoke:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Build web
        run: npm run build:web
      - name: Start preview server
        run: |
          nohup npm run preview -w @sizhu/web -- --port 4173 > /tmp/astrocopy-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/astrocopy-preview.log
          exit 1
      - name: Run shared WebMCP browser test
        env:
          ASTROCOPY_E2E_URL: http://127.0.0.1:4173
        run: node tools/e2e-webmcp.mjs
      - name: Upload WebMCP screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webmcp-smoke
          path: artifacts/e2e
          if-no-files-found: ignore
          retention-days: 7

  liuren-reference:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Checkout pinned kinliuren source
        uses: actions/checkout@v4
        with:
          repository: kentang2017/kinliuren
          ref: 3ba45a9540f08269b56d81508a061c7d46938785
          path: _oracle/kinliuren
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate pinned executable fixture
        env:
          PYTHONPATH: _oracle/kinliuren/src
        run: python tools/liuren-reference/oracle.py --validate-pinned-fixture > /tmp/liuren-reference.json
      - name: Show reference summary
        run: |
          python - <<'PY'
          import json
          data = json.load(open('/tmp/liuren-reference.json', encoding='utf-8'))
          print('節氣:', data.get('節氣'))
          print('日期:', data.get('日期'))
          print('格局:', data.get('格局'))
          print('三傳:', data.get('三傳'))
          print('核心 result 含神煞:', '神煞' in data)
          PY
