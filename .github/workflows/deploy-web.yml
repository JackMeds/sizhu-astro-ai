name: Deploy React static web

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build web
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Checkout discovery sources
        uses: actions/checkout@v4
      - name: Setup Node for search notification
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Notify IndexNow of current public URLs
        id: indexnow
        continue-on-error: true
        env:
          INDEXNOW_SITEMAP_URL: https://astrocopy.jackmeds.top/sitemap.xml
        run: node tools/submit-indexnow.mjs
      - name: Report search notification result
        if: always()
        run: echo "IndexNow notification outcome — ${{ steps.indexnow.outcome }}" >> "$GITHUB_STEP_SUMMARY"
