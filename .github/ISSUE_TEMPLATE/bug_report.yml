name: Bug report
description: Report a reproducible product, UI, build, MCP or WebMCP bug.
title: "[bug] "
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: "1. Open...\n2. Enter...\n3. Click..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Browser/client, OS, commit/version"
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove names, birth/casting data, tokens and other private information first.
